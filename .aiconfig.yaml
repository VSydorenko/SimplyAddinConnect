# .aiconfig.yaml
# Файл конфигурации для систем искусственного интеллекта
# Содержит базовую документацию и рекомендации по работе с проектом

project:
  name: SimplyConnect_Addin
  description: Компоненты для работы с оборудованием в среде 1С

guidelines:
  logging:
    description: >
      Интеграция механизмов логирования с использованием ServiceTools и макросов REPORT_*.
      Включение логирования из 1С.
    example: |
      // Необходимые заголовочные файлы
      #include "helpers/ServiceTools.h"
      // НЕ НУЖНО! Не используйте прямой импорт spdlog в компонентах
      // #include <spdlog/spdlog.h>

      void КлассКомпонента::RegisterMethods() {
          // ... Другие методы компонента
          // Добавление метода для включения логирования из 1С
          AddFunction(u"EnableLogging", u"ИспользоватьЛогирование",
              [&](VH logLevel, VH logFilePath) {
                  std::string level = logLevel;
                  std::string path = logFilePath;
                  std::string logMessage = "Включение логирования с уровнем: " + level + ", путь: " + path;
                  REPORT_INFO(logMessage);
                  return this->EnableLogging(level, path);
              }
          );
          // ... Другие методы компонента
      }

      // Реализация метода EnableLogging в классе компонента
      bool КлассКомпонента::EnableLogging(const std::string& logLevel, const std::string& logFilePath) {
          // Делегирование вызова к ServiceTools
          return ServiceTools::EnableComponentLogging(this, logLevel, logFilePath);
      }

      // Использование макросов логирования в коде компонента
      void КлассКомпонента::КакойТоМетод() {
          REPORT_INFO("Информационное сообщение");
          int значение = 123;
          std::string debugMsg = "Отладочное сообщение: " + std::to_string(значение);
          REPORT_DEBUG(debugMsg);
          REPORT_WARN("Предупреждение при выполнении операции");

          bool обнаруженаОшибка = true; // пример условия
          if (обнаруженаОшибка) {
              REPORT_ERROR("Описание ошибки для пользователя");
              return;
          }
      }
      // Уровни логирования: REPORT_TRACE, REPORT_DEBUG, REPORT_INFO, REPORT_WARN, REPORT_ERROR

      // Отключение логирования при уничтожении компонента
      КлассКомпонента::~КлассКомпонента() {
          REPORT_INFO("Завершение работы компонента");
          ServiceTools::DisableComponentLogging(this);
      }

  method_registration_logging:
    description: >
      Рекомендации по регистрации методов компонентов с акцентом на интеграцию логирования.
    example: |
      #include "helpers/ServiceTools.h"

      void КлассКомпонента::RegisterMethods() {
          // Регистрация функции для включения логирования (EnableLogging)
          // детально описана в секции 'logging'.

          // Пример функции с логированием и обработкой ошибок
          AddFunction(u"Payment", u"Оплата",
              [&](VH amount, VH cardType) {
                  double amt = amount;
                  std::string card = cardType;
                  std::string debugMsg = "Запуск операции оплаты: сумма=" + std::to_string(amt) + ", карта=" + card;
                  REPORT_DEBUG(debugMsg);

                  if (amt <= 0) {
                      std::string errorMsg = "Некорректная сумма платежа: " + std::to_string(amt);
                      REPORT_ERROR(errorMsg);
                      return false; // Важно вернуть false после REPORT_ERROR
                  }
                  // ... логика операции ...
                  // bool result = this->DoPayment(amt, card);
                  // if (!result) {
                  //     REPORT_ERROR("Не удалось выполнить операцию оплаты");
                  //     return false;
                  // }
                  REPORT_INFO("Операция оплаты успешно выполнена");
                  return true;
              }
          );

          // Пример процедуры с логированием
          AddProcedure(u"SetText", u"УстановитьТекст",
              [&](VH text) {
                  std::string str = text;
                  std::string debugMsg = "Установка текстового значения: " + str;
                  REPORT_DEBUG(debugMsg);
                  // this->SetSomeText(str);
                  REPORT_TRACE("Текстовое значение успешно установлено");
              }
          );
          // ВАЖНО:
          // 1. Используйте макросы REPORT_* для логирования во всех регистрируемых методах.
          // 2. REPORT_ERROR автоматически регистрирует ошибку для 1С.
          // 3. При возникновении ошибки в функции, вызывайте REPORT_ERROR и возвращайте false.
          // 4. Все строки для макросов REPORT_* должны быть сформированы заранее.
      }

  error_handling_standards:
    description: >
      Стандарты обработки ошибок и логирования в компонентах.
    rules: |
      ## Ключевые правила обработки ошибок и логирования:

      1.  **Используйте макросы `REPORT_*`** (в методах компонента) и **`NEUTRAL_REPORT_*`** (в const-методах или вне контекста AddInNative):
          -   `REPORT_TRACE` / `NEUTRAL_REPORT_TRACE`: Детальное протоколирование.
          -   `REPORT_DEBUG` / `NEUTRAL_REPORT_DEBUG`: Отладочные сообщения.
          -   `REPORT_INFO` / `NEUTRAL_REPORT_INFO`: Информационные сообщения.
          -   `REPORT_WARN` / `NEUTRAL_REPORT_WARN`: Предупреждения.
          -   `REPORT_ERROR` / `NEUTRAL_REPORT_ERROR`: Ошибки. `REPORT_ERROR` автоматически регистрирует ошибку в 1С.

      2.  **Форматирование сообщений**:
          -   Формируйте строки сообщения **заранее** перед передачей в макрос, используя конкатенацию `std::string` и `std::to_string()` для чисел.
              Пример: `std::string msg = "Сообщение: " + переменная + ", значение: " + std::to_string(число);`
          -   Сообщения должны начинаться с заглавной буквы.
          -   Не добавляйте точку в конце сообщения (если это не часть динамических данных).
          -   **Запрещено**: Форматирование в стиле `printf` внутри макросов (например, `REPORT_ERROR("Ошибка: %s", str.c_str())`).

      3.  **Обработка ошибок**:
          -   После вызова `REPORT_ERROR` (или `NEUTRAL_REPORT_ERROR`) обычно следует вернуть `false` из функции, если она предполагает индикацию успеха/неудачи.
          -   Не используйте `throw` для обработки ошибок на уровне бизнес-логики, которые должны быть сообщены 1С.
          -   Оборачивайте код, который может вызвать C++ исключения, в блок `try-catch`. В блоке `catch` используйте `REPORT_ERROR` (или `NEUTRAL_REPORT_ERROR`) с описанием исключения.
              Пример: `std::string errorMsg = "Исключение C++: " + std::string(e.what()); REPORT_ERROR(errorMsg);`

      4.  **Const-методы и NEUTRAL_REPORT_***:
          -   В const-методах или статических функциях, где `this` компонента недоступен или неуместен для `REPORT_*`, используйте макросы `NEUTRAL_REPORT_*`.
          -   Первым параметром `NEUTRAL_REPORT_*` передается имя компонента (строка).
              Пример: `NEUTRAL_REPORT_ERROR("МойКомпонент", "Ошибка в const-методе");`

      5.  **Запрещённые практики**:
          -   Прямое использование `AddInNative::MB2WCHAR()` и `AddInNative::WCHAR2MB()` (используйте `ServiceTools::SafeMB2WCHAR` и `ServiceTools::SafeWCHAR2MB`).
          -   Прямое использование `spdlog`.
          -   Использование методов `ServiceTools::*V` (например, `InfoV`, `ErrorV`).
          -   Использование `ServiceTools::FormatString`, `ServiceTools::FormatWideString` для форматирования строк логов.

  neutral_logging:
    description: >
      Использование `NEUTRAL_REPORT_*` макросов для логирования в ситуациях, когда контекст `AddInNative` (и `this` компонента) недоступен, например, в const-методах или статических функциях.
    example: |
      // Пример использования NEUTRAL_REPORT_* макросов
      const std::string componentName = "TestComponent"; // Имя компонента

      // Логирование информационного сообщения
      NEUTRAL_REPORT_INFO(componentName, "Информационное сообщение из neutral");

      // Логирование ошибки
      try {
          // Код, который может вызвать ошибку
          throw std::runtime_error("Пример ошибки");
      } catch (const std::exception& e) {
          std::string errorMsg = "Ошибка neutral: " + std::string(e.what());
          NEUTRAL_REPORT_ERROR(componentName, errorMsg);
      }

      // Логирование предупреждения
      NEUTRAL_REPORT_WARN(componentName, "Предупреждение neutral о возможной проблеме");

      // ВАЖНО: NEUTRAL_REPORT_* макросы принимают имя компонента как первый параметр.

      class MyComponent {
      public:
          // ...
          bool ValidateData(const std::string& data) const { // const-метод
              if (data.empty()) {
                  NEUTRAL_REPORT_ERROR("MyComponent", "Пустая строка для проверки в const-методе");
                  return false;
              }
              std::string msg = "Данные для проверки (const): " + data;
              NEUTRAL_REPORT_DEBUG("MyComponent", msg);
              return true;
          }
      };
